<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
    <rect width="500" height="350" fill="#040c17"/>
    <!-- Blueprint grid -->
    <path d="M0 50 H500 M0 100 H500 M0 150 H500 M0 200 H500 M0 250 H500 M0 300 H500" stroke="#e4e4e7" stroke-width="0.7" stroke-opacity="0.15"/>
    <path d="M50 0 V350 M100 0 V350 M150 0 V350 M200 0 V350 M250 0 V350 M300 0 V350 M350 0 V350 M400 0 V350 M450 0 V350" stroke="#e4e4e7" stroke-width="0.7" stroke-opacity="0.15"/>
    <!-- Outer CAD Border -->
    <rect x="15" y="15" width="470" height="320" stroke="#e4e4e7" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Technical Crosshair -->
    <circle cx="250" cy="165" r="90" stroke="#e4e4e7" stroke-width="1.5" stroke-dasharray="6 3"/>
    <circle cx="250" cy="165" r="45" stroke="#d4d4d8" stroke-width="1.5"/>
    <line x1="130" y1="165" x2="370" y2="165" stroke="#e4e4e7" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="250" y1="50" x2="250" y2="280" stroke="#e4e4e7" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- Dimension arrows -->
    <line x1="160" y1="85" x2="340" y2="85" stroke="#e4e4e7" stroke-width="1.5"/>
    <polyline points="166,81 160,85 166,89" stroke="#e4e4e7" stroke-width="1.5"/>
    <polyline points="334,81 340,85 334,89" stroke="#e4e4e7" stroke-width="1.5"/>
    <text x="250" y="78" fill="#e4e4e7" font-family="monospace" font-size="11" text-anchor="middle">PARAMETRIC RADIUS [R-VAR]</text>
    <!-- Title block -->
    <rect x="25" y="270" width="220" height="50" fill="#031122" stroke="#e4e4e7" stroke-width="1"/>
    <text x="35" y="290" fill="#e4e4e7" font-family="monospace" font-size="10" font-weight="bold">CAD SPEC: VERTEBRAE GEOMETRY</text>
    <text x="35" y="308" fill="#94A3B8" font-family="monospace" font-size="9">SCALE: 1:1 | PROT-SPIROBE</text>
